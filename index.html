  { num:26, dates:"8–14 Dec", theme:"A Full World of Words", age:"~23 months", color:"#2A7B8C", light:"#E8F4F8", focus:"Conversation & Narrative",
    intro:"One month before her second birthday. By now, the language journey you've been on together has filled her with a working vocabulary she uses every day. This week is about celebrating how far she has come and pushing joyfully into the next layer: narrative, description, and the first real conversations.",
    activities:[
      {name:"Conversation Corner",time:"10 min",icon:"💬",desc:"Each morning, have a brief, real conversation — not about logistics, but about her: 'what shall we do today? What was your favourite thing yesterday? What do you like better, apples or oranges?' Listen fully. Let her lead the thread.",materials:"Just your undivided attention"},
      {name:"Story Retelling",time:"10 min",icon:"📖",desc:"After reading a favourite book, put it down and say: 'you tell me the story.' Accept any contribution — a sound, a word, pointing at the closed book. Build around what she offers. This is the birth of literary narration.",materials:"Familiar favourite book"},
      {name:"Photo Album Language",time:"15 min",icon:"📸",desc:"Look through a photo album or phone photos together. 'Who is this? What is happening here? Where are we? You were so little! Look at you now!' Photos are a language-rich window into memory, self, and relationship.",materials:"Photos — printed or digital"},

      {name:"Thank You Ritual",time:"5 min",icon:"💛",desc:"Begin a simple daily gratitude practice: 'what was one good thing today?' She may say one word: 'dog' or 'cake'. That is a complete answer. The habit of noticing good things is one of the most powerful things you can build.",materials:"Just a quiet moment each evening"},
    ],
    watchFor:["Is she holding real back-and-forth conversations?","Can she retell a simple story or describe a recent event?","Is she using past tense, even if incorrectly ('I goed', 'he falled')?","Watch for her talking to herself during play — the beginning of inner speech"],

  { num:27, dates:"8–14 Dec", theme:"Celebrations and Traditions", age:"~23 months", color:"#D97706", light:"#FEF3C7", focus:"Ritual, Community & Belonging",
    intro:"December brings ritual, and ritual is one of the great gifts of early childhood. Predictable, repeated, meaningful events teach children about time, family, community, belonging, and the pattern of the year. Whatever you celebrate, the point is participation, wonder, and the warm knowledge that this family does certain things together.",
    activities:[
      {name:"Decoration Making",time:"30 min",icon:"✨",desc:"Make simple decorations together: paper chains, salt-dough ornaments, painted pine cones. Let her choose colours, place things where she wants, take pride in her contribution to the home's appearance.",materials:"Paper, paint, salt dough (1 cup flour, ½ cup salt, ½ cup water), natural items"},
      {name:"Seasonal Book Collection",time:"Daily",icon:"📚",desc:"Pull out or borrow seasonal books — whatever your tradition. Read them repeatedly. Familiar seasonal books carry enormous emotional weight and build temporal awareness: 'we read this every December'.",materials:"Seasonal books from library or collection"},

      {name:"Light Exploration",time:"15 min",icon:"🕯️",desc:"Walk at dusk to see lights. Make a simple lantern from a jar. Talk about light in the dark. Candles, fairy lights, a torch in a dark room — light is magical at this age.",materials:"Jar lantern, safe candle or battery tea light, torch"},

    adapt:"If the sensory overload of the festive season is hard for her (some children find this period overwhelming), protect quiet time at home. A calm, consistent daily rhythm is the best gift you can give during a busy season."

  { num:28, dates:"15–31 Dec", theme:"Looking Back, Leaning Forward", age:"~23 months", color:"#1B3A5C", light:"#E8ECF4", focus:"Reflection & Celebration",
    intro:"The final weeks of the year are not a curriculum — they are a celebration. You have given Naomi a remarkable year of play, language, exploration, movement, art, music, wonder, and loving presence. This is the season to reflect, enjoy, and let her simply be.",
    activities:[
      {name:"Year in Photos",time:"20 min",icon:"📸",desc:"Look through the year's photos together. Name what you see: activities, places, people, seasons. 'There you are in summer! And the leaves! You have grown SO much.' This builds autobiographical memory and a narrative sense of self.",materials:"Phone or printed photos from the year"},

  {icon:"🌳",label:"Outdoor Time",detail:"Every day"},
  {icon:"🎯",label:"Activity",detail:"15–30 min max"},
  {icon:"🥣",label:"Meal Talk",detail:"Narrate & connect"},
  {icon:"🎨",label:"Free Play",detail:"Follow her lead"},
  {icon:"🌙",label:"Bedtime Story",detail:"Non-negotiable"},
];

const DOCS = [
  {name:"Complete Curriculum Guide",desc:"Full 28-week guide from 15 months to 2 years",icon:"📋",color:"#2A7B8C",tag:"Full Guide"},
  {name:"Daily Rhythm Reference",desc:"Morning book · Outdoor · Activity · Meals · Bedtime",icon:"🌅",color:"#D97706",tag:"Quick Ref"},
  {name:"Developmental Milestones",desc:"Month-by-month markers for 15–24 months",icon:"📊",color:"#6B5EA8",tag:"Reference"},
  {name:"Activity Materials List",desc:"Complete prep list for all 28 weeks",icon:"🛒",color:"#5A7A5A",tag:"Checklist"},
  {name:"Milestone Tracker",desc:"Track her progress week by week",icon:"⭐",color:"#B05070",tag:"Tracker"},
];

const HELP_REPLIES = [
  w=>`For "${w.theme}", the key thing to remember is that her engagement is the signal. If she's lighting up, lean in. If she's not, follow her somewhere else — the developmental work still happens.`,
  ()=>"The most important thing you can do any day this week is narrate what she's doing in simple sentences. That language bath is building vocabulary she'll use for years.",
  ()=>"Trust the slow. Some weeks she'll seem to have leapt forward overnight; others nothing seems to be happening. Both are normal. Development consolidates in rest as much as in activity.",
  w=>`The adapt section for Week ${w.num} is worth re-reading — it's the most personalised guidance in the week. You know her best; use those notes as a starting point, not a prescription.`,
  ()=>"You're doing brilliantly. Showing up every day and paying attention — that is the whole curriculum. Everything else is useful scaffolding around that central fact.",
  ()=>"If something isn't landing this week, skip it completely and come back next week. There's nothing in this guide that can't wait seven days. Her wellbeing today is the priority.",
  ()=>"Remember: repetition is learning at this age. When she wants to do the same activity for the fifth day running, that's not boredom — that's consolidation. Let her lead.",
];

// ─── State ────────────────────────────────────────────────────────────────────
const getInitialWeek = () => {
  const june9 = new Date(2025, 5, 9); // Week 1 starts 9 June — Naomi turns 15 months 16 June
  const diff = Math.floor((Date.now() - june9) / (7*24*60*60*1000));
  return Math.max(0, Math.min(diff, WEEKS.length-1));
};

let state = {
  screen: "home",
  weekIdx: getInitialWeek(),
  tab: "activities",
  overlay: null, // "weeks"|"help"|"notes"
  helpMsgs: [{from:"guide",text:"Hello! I'm here to help you with Naomi's curriculum. Ask me about any activity, what to expect this week, how to adapt something, or anything about Naomi's development. 👶"}],
  helpInput: "",
  noteText: "",
  showBanner: !localStorage.getItem("banner_dismissed"),
};

// ─── Render ───────────────────────────────────────────────────────────────────
const app = document.getElementById("app");

function render() {
  const w = WEEKS[state.weekIdx];
  document.documentElement.style.setProperty("--week-color", w.color);

  const headerGrad = `linear-gradient(135deg, ${w.color} 0%, #1B3A5C 100%)`;

  app.innerHTML = `
    ${state.showBanner ? `
    <div class="install-banner" id="banner">
      <p id="banner-text">📲 Add Naomi's app to your home screen</p>
      <button id="install-btn" style="display:none">Install</button>
      <button class="dismiss" id="dismiss-btn">✕</button>
    </div>` : ""}

    <!-- Main screens -->
    <div id="main-area" style="flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;">

      ${state.screen === "home" ? `
      <div class="screen" id="home-screen">
        <!-- Week header -->
        <div class="week-header" style="background:${headerGrad};">
          <div class="header-row">
            <div>
              <div class="label">Growing Up Wonderful</div>
              <div class="title">Week ${w.num} · ${w.age}</div>
              <div class="sub">${w.dates}</div>
            </div>
            <button class="week-btn" onclick="openOverlay('weeks')">All Weeks ▾</button>
          </div>
          <div class="theme">${w.theme}</div>
          <div class="badge">Focus: ${w.focus}</div>
        </div>

        <!-- Daily rhythm -->
        <div class="rhythm-wrap">
          <div class="rhythm-label">Today's Rhythm</div>
          <div class="rhythm-row">
            ${RHYTHM.map(r=>`
              <div class="rhythm-card">
                <div class="ri">${r.icon}</div>
                <div class="rl">${r.label}</div>
                <div class="rd">${r.detail}</div>
              </div>`).join("")}
          </div>
        </div>

        <!-- Intro card -->
        <div class="intro-card" style="background:${w.light};border-left-color:${w.color};">
          <div class="ic-label" style="color:${w.color};">This Week</div>
          <div class="ic-text">${w.intro}</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          ${[["activities","Activities"],["observe","Watch For"],["milestones","Milestones"],["adapt","Adapt"]].map(([id,label])=>`
            <button class="tab-btn${state.tab===id?" active":""}" style="${state.tab===id?`color:${w.color}`:""}" onclick="setTab('${id}')">${label}</button>
          `).join("")}
        </div>

        <!-- Tab content -->
        ${state.tab === "activities" ? `
        <div class="activity-list">
          ${w.activities.map((a,i)=>`
            <div class="act-card">
              <div class="act-top">
                <div class="act-icon" style="background:${w.light};">${a.icon}</div>
                <div>
                  <div class="act-name">${a.name}</div>
                  <div class="act-time" style="color:${w.color};">${a.time}</div>
                </div>
              </div>
              <div class="act-desc">${a.desc}</div>
              <div class="act-mat">
                <span class="act-mat-label">MATERIALS: </span>
                <span class="act-mat-text">${a.materials}</span>
              </div>
            </div>
          `).join("")}
        </div>` : ""}

        ${state.tab === "observe" ? `
        <div class="info-card">
          <div class="info-title" style="color:${w.color};">What to Watch For</div>
          ${w.watchFor.map((item,i)=>`
            <div class="info-item">
              <div class="info-num" style="background:${w.light};color:${w.color};">${i+1}</div>
              <div class="info-text">${item}</div>
            </div>
          `).join("")}
        </div>` : ""}

        ${state.tab === "milestones" ? `
        <div class="info-card">
          <div class="info-title" style="color:#D97706;">Developmental Markers</div>
          ${w.milestones.map(m=>`
            <div class="info-item">
              <span style="font-size:16px;flex-shrink:0;">⭐</span>
              <div class="info-text">${m}</div>
            </div>
          `).join("")}
          <div class="milestone-note"><strong>Remember:</strong> Milestones are averages, not deadlines. The range of typical development is enormous.</div>
        </div>` : ""}

        ${state.tab === "adapt" ? `
        <div class="adapt-card">
          <div class="adapt-title">
            <span style="font-size:20px;">🌱</span>
            <span style="font-size:13px;font-weight:700;color:#5A7A5A;">Adapting to Your Child</span>
          </div>
          <div class="adapt-text">${w.adapt}</div>
        </div>
        <div class="principle-card">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
            <span style="font-size:20px;">🧭</span>
            <span style="font-size:13px;font-weight:700;color:#374151;">Core Principle</span>
          </div>
          <div class="principle-text">"Follow the child. The weekly theme is a suggestion, not an obligation. If she's obsessed with water pouring and ignores your planned activity, teach through water pouring."</div>
        </div>` : ""}
      </div>` : ""}

      ${state.screen === "docs" ? `
      <div class="screen" id="docs-screen">
        <div class="week-header" style="background:linear-gradient(135deg,#1B3A5C 0%,#2A7B8C 100%);">
          <div class="label">Growing Up Wonderful</div>
          <div class="title">Documents</div>
          <div class="sub">Everything in one place. One tap to open.</div>
        </div>
        <div class="doc-list">
          ${DOCS.map(d=>`
            <div class="doc-card">
              <div class="doc-icon" style="background:${d.color}18;">${d.icon}</div>
              <div style="flex:1;min-width:0;">
                <div class="doc-name">${d.name}</div>
                <div class="doc-desc">${d.desc}</div>
              </div>
              <div class="doc-tag" style="background:${d.color}15;color:${d.color};">${d.tag}</div>
            </div>
          `).join("")}
          <div class="doc-add">
            <div style="font-size:28px;margin-bottom:8px;">📎</div>
            <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:3px;">Add Document</div>
            <div style="font-size:12px;color:#9CA3AF;">Tap to upload a Word document or PDF</div>
          </div>
        </div>
      </div>` : ""}

      <!-- Overlays -->
      ${state.overlay === "weeks" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#1B3A5C 0%,#2A7B8C 100%);">
          <div>
            <div class="label">Navigate</div>
            <div class="title">All 28 Weeks</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="week-list">
          ${WEEKS.map((wk,i)=>`
            <button class="week-item${state.weekIdx===i?" active":""}"
              style="${state.weekIdx===i?`background:${wk.light};border-color:${wk.color};border-width:2px;`:""}"
              onclick="selectWeek(${i})">
              <div class="week-num" style="background:${wk.color};">${wk.num}</div>
              <div class="week-info">
                <div class="week-info-name">${wk.theme}</div>
                <div class="week-info-sub">${wk.dates} · ${wk.age}</div>
              </div>
              ${state.weekIdx===i?`<span style="color:${wk.color};font-size:18px;font-weight:800;">✓</span>`:""}
            </button>
          `).join("")}
        </div>
      </div>` : ""}

      ${state.overlay === "help" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#5A7A5A 0%,#2A7B8C 100%);">
          <div>
            <div class="label">On-demand</div>
            <div class="title">Help & Chat</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="chat-body" id="chat-body">
          ${state.helpMsgs.map(m=>`
            <div class="chat-msg ${m.from}">${m.text}</div>
          `).join("")}
        </div>
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" type="text" placeholder="Ask about this week, an activity, milestones..." value="${state.helpInput.replace(/"/g,'&quot;')}" oninput="state.helpInput=this.value" onkeydown="if(event.key==='Enter')sendHelp()"/>
          <button class="chat-send" onclick="sendHelp()">↑</button>
        </div>
      </div>` : ""}

      ${state.overlay === "notes" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#B05070 0%,#6B5EA8 100%);">
          <div>
            <div class="label">Week ${w.num}</div>
            <div class="title">My Notes</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="notes-body">
          <div class="notes-hint">What did you notice this week? What worked? What surprised you?</div>
          <textarea class="notes-ta" id="notes-ta" placeholder="Jot down observations, things she loved, adaptations you made, milestones you noticed..." oninput="state.noteText=this.value">${state.noteText}</textarea>
          <button class="notes-save" style="background:#B05070;" onclick="saveNote()">Save Note</button>
        </div>
      </div>` : ""}

    </div><!-- /main-area -->

    <!-- FAB -->
    ${!state.overlay ? `<button class="fab" onclick="openOverlay('help')">💬</button>` : ""}

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-btn" onclick="setScreen('home')">
        <span class="nav-icon">📅</span>
        <span class="nav-label${state.screen==="home"?" active":""}">This Week</span>
      </button>
      <button class="nav-btn" onclick="setScreen('docs')">
        <span class="nav-icon">📄</span>
        <span class="nav-label${state.screen==="docs"?" active":""}">Documents</span>
      </button>
      <button class="nav-btn" onclick="openOverlay('notes')">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">Notes</span>
      </button>
    </nav>
  `;

  // Scroll chat to bottom
  const chatBody = document.getElementById("chat-body");
  if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;

  // Restore textarea
  const ta = document.getElementById("notes-ta");
  if (ta) ta.value = state.noteText;

  // Install banner logic
  setupBanner();
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function setScreen(s) { state.screen = s; state.overlay = null; render(); }
function setTab(t) { state.tab = t; render(); window.scrollTo(0,0); const el = document.getElementById("home-screen"); if(el) el.scrollTo(0,0); }
function openOverlay(o) { state.overlay = o; render(); }
function closeOverlay() { state.overlay = null; render(); }
function selectWeek(i) { state.weekIdx = i; state.overlay = null; state.tab = "activities"; state.screen = "home"; render(); }

function sendHelp() {
  const input = document.getElementById("chat-input");
  const msg = (input ? input.value : state.helpInput).trim();
  if (!msg) return;
  state.helpMsgs.push({from:"user", text:msg});
  state.helpInput = "";
  render();
  setTimeout(() => {
    const w = WEEKS[state.weekIdx];
    const fn = HELP_REPLIES[Math.floor(Math.random()*HELP_REPLIES.length)];
    state.helpMsgs.push({from:"guide", text:fn(w)});
    render();
  }, 700);
}

function saveNote() {
  const ta = document.getElementById("notes-ta");
  if (ta) state.noteText = ta.value;
  const key = `note_week_${state.weekIdx}`;
  try { localStorage.setItem(key, state.noteText); } catch(e) {}
  // Flash save confirmation
  const btn = document.querySelector(".notes-save");
  if (btn) { btn.textContent = "Saved ✓"; btn.style.background="#5A7A5A"; setTimeout(()=>{ btn.textContent="Save Note"; btn.style.background="#B05070"; },1500); }
}

// ─── Install banner ───────────────────────────────────────────────────────────
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById("install-btn");
  const txt = document.getElementById("banner-text");
  if (btn && txt) {
    txt.textContent = "📲 Install Naomi's curriculum app";
    btn.style.display = "block";
  }
});

function setupBanner() {
  const dismissBtn = document.getElementById("dismiss-btn");
  if (dismissBtn) dismissBtn.onclick = () => {
    localStorage.setItem("banner_dismissed","1");
    state.showBanner = false;
    render();
  };
  const installBtn = document.getElementById("install-btn");
  if (installBtn) installBtn.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const {outcome} = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === "accepted") { state.showBanner = false; render(); }
    }
  };
}

// ─── Service Worker ───────────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE="guw-v1";
    self.addEventListener("install",e=>{self.skipWaiting();});
    self.addEventListener("activate",e=>{self.clients.claim();});
    self.addEventListener("fetch",e=>{
      if(e.request.method!=="GET")return;
      e.respondWith(
        caches.open(CACHE).then(cache=>
          cache.match(e.request).then(hit=>{
            const net=fetch(e.request).then(res=>{
              if(res&&res.status===200)cache.put(e.request,res.clone());
              return res;
            });
            return hit||net;
          })
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type:"application/javascript"});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
