        <!-- Intro card -->
        <div class="intro-card" style="background:${w.light};border-left-color:${w.color};">
          <div class="ic-label" style="color:${w.color};">This Week</div>
          <div class="ic-text">${w.intro}</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          ${[["activities","Activities"],["faith","Faith 🙏"],["observe","Watch For"],["milestones","Milestones"],["adapt","Adapt"]].map(([id,label])=>`
            <button class="tab-btn${state.tab===id?" active":""}" style="${state.tab===id?`color:${w.color}`:""}" onclick="setTab('${id}')">${label}</button>
          `).join("")}
        </div>

        <!-- Tab content -->
        ${state.tab === "activities" ? `
        <div class="activity-list">
          ${w.activities.map((a,i)=>`
            <div class="act-card">
              <div class="act-top">
                <div class="act-icon" style="background:${w.light};">${a.icon}</div>
                <div>
                  <div class="act-name">${a.name}</div>
                  <div class="act-time" style="color:${w.color};">${a.time}</div>
                </div>
              </div>
              <div class="act-desc">${a.desc}</div>
              <div class="act-mat">
                <span class="act-mat-label">MATERIALS: </span>
                <span class="act-mat-text">${a.materials}</span>
              </div>
            </div>
          `).join("")}
        </div>` : ""}

        ${state.tab === "observe" ? `
        <div class="info-card">
          <div class="info-title" style="color:${w.color};">What to Watch For</div>
          ${w.watchFor.map((item,i)=>`
            <div class="info-item">
              <div class="info-num" style="background:${w.light};color:${w.color};">${i+1}</div>
              <div class="info-text">${item}</div>
            </div>
          `).join("")}
        </div>` : ""}

        ${state.tab === "milestones" ? `
        <div class="info-card">
          <div class="info-title" style="color:#D97706;">Developmental Markers</div>
          ${w.milestones.map(m=>`
            <div class="info-item">
              <span style="font-size:16px;flex-shrink:0;">⭐</span>
              <div class="info-text">${m}</div>
            </div>
          `).join("")}
          <div class="milestone-note"><strong>Remember:</strong> Milestones are averages, not deadlines. The range of typical development is enormous.</div>
        </div>` : ""}

        
        ${state.tab === "faith" ? `
        <div style="padding:0 20px 16px;">
          <div style="background:linear-gradient(135deg,#1B3A5C 0%,#2A7B8C 100%);border-radius:16px;padding:18px;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;">✝ This Week's Verse</div>
            <div style="font-size:16px;font-style:italic;color:#fff;line-height:1.6;margin-bottom:8px;">"${BIBLE[state.weekIdx].verse}"</div>
            <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);">${BIBLE[state.weekIdx].ref}</div>
          </div>

          <div style="background:#fff;border-radius:16px;padding:16px;border:1px solid #E8ECEF;margin-bottom:12px;">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
              <span style="font-size:20px;">📖</span>
              <span style="font-size:13px;font-weight:700;color:#1B3A5C;">${BIBLE[state.weekIdx].theme}</span>
            </div>
            <div style="font-size:13.5px;line-height:1.65;color:#374151;">${BIBLE[state.weekIdx].teaching}</div>
          </div>

          <div style="background:#EDF4ED;border-radius:16px;padding:16px;border:1px solid rgba(90,122,90,.2);margin-bottom:12px;">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
              <span style="font-size:20px;">🌱</span>
              <span style="font-size:13px;font-weight:700;color:#5A7A5A;">Faith Activity</span>
            </div>
            <div style="font-size:13.5px;line-height:1.65;color:#374151;">${BIBLE[state.weekIdx].activity}</div>
          </div>

          <div style="background:linear-gradient(135deg,#6B5EA8 0%,#B05070 100%);border-radius:16px;padding:16px;">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
              <span style="font-size:20px;">🙏</span>
              <span style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);">Prayer for This Week</span>
            </div>
            <div style="font-size:13.5px;line-height:1.7;color:rgba(255,255,255,0.92);font-style:italic;">${BIBLE[state.weekIdx].prayer}</div>
          </div>
        </div>` : ""}

        ${state.tab === "adapt" ? `
        <div class="adapt-card">
          <div class="adapt-title">
            <span style="font-size:20px;">🌱</span>
            <span style="font-size:13px;font-weight:700;color:#5A7A5A;">Adapting to Your Child</span>
          </div>
          <div class="adapt-text">${w.adapt}</div>
        </div>
        <div class="principle-card">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
            <span style="font-size:20px;">🧭</span>
            <span style="font-size:13px;font-weight:700;color:#374151;">Core Principle</span>
          </div>
          <div class="principle-text">"Follow the child. The weekly theme is a suggestion, not an obligation. If she's obsessed with water pouring and ignores your planned activity, teach through water pouring."</div>
        </div>` : ""}
      </div>` : ""}

      ${state.screen === "docs" ? `
      <div class="screen" id="docs-screen">
        <div class="week-header" style="background:linear-gradient(135deg,#1B3A5C 0%,#2A7B8C 100%);">
          <div class="label">Growing Up Wonderful</div>
          <div class="title">Documents</div>
          <div class="sub">Everything in one place. One tap to open.</div>
        </div>
        <div class="doc-list">
          ${DOCS.map(d=>`
            <div class="doc-card">
              <div class="doc-icon" style="background:${d.color}18;">${d.icon}</div>
              <div style="flex:1;min-width:0;">
                <div class="doc-name">${d.name}</div>
                <div class="doc-desc">${d.desc}</div>
              </div>
              <div class="doc-tag" style="background:${d.color}15;color:${d.color};">${d.tag}</div>
            </div>
          `).join("")}
          <div class="doc-add">
            <div style="font-size:28px;margin-bottom:8px;">📎</div>
            <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:3px;">Add Document</div>
            <div style="font-size:12px;color:#9CA3AF;">Tap to upload a Word document or PDF</div>
          </div>
        </div>
      </div>` : ""}

      <!-- Overlays -->
      ${state.overlay === "weeks" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#1B3A5C 0%,#2A7B8C 100%);">
          <div>
            <div class="label">Navigate</div>
            <div class="title">All 28 Weeks</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="week-list">
          ${WEEKS.map((wk,i)=>`
            <button class="week-item${state.weekIdx===i?" active":""}"
              style="${state.weekIdx===i?`background:${wk.light};border-color:${wk.color};border-width:2px;`:""}"
              onclick="selectWeek(${i})">
              <div class="week-num" style="background:${wk.color};">${wk.num}</div>
              <div class="week-info">
                <div class="week-info-name">${wk.theme}</div>
                <div class="week-info-sub">${wk.dates} · ${wk.age}</div>
              </div>
              ${state.weekIdx===i?`<span style="color:${wk.color};font-size:18px;font-weight:800;">✓</span>`:""}
            </button>
          `).join("")}
        </div>
      </div>` : ""}

      ${state.overlay === "help" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#5A7A5A 0%,#2A7B8C 100%);">
          <div>
            <div class="label">On-demand</div>
            <div class="title">Help & Chat</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="chat-body" id="chat-body">
          ${state.helpMsgs.map(m=>`
            <div class="chat-msg ${m.from}">${m.text}</div>
          `).join("")}
        </div>
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" type="text" placeholder="Ask about this week, an activity, milestones..." value="${state.helpInput.replace(/"/g,'&quot;')}" oninput="state.helpInput=this.value" onkeydown="if(event.key==='Enter')sendHelp()"/>
          <button class="chat-send" onclick="sendHelp()">↑</button>
        </div>
      </div>` : ""}

      ${state.overlay === "notes" ? `
      <div class="overlay">
        <div class="overlay-header" style="background:linear-gradient(135deg,#B05070 0%,#6B5EA8 100%);">
          <div>
            <div class="label">Week ${w.num}</div>
            <div class="title">My Notes</div>
          </div>
          <button class="close-btn" onclick="closeOverlay()">✕</button>
        </div>
        <div class="notes-body">
          <div class="notes-hint">What did you notice this week? What worked? What surprised you?</div>
          <textarea class="notes-ta" id="notes-ta" placeholder="Jot down observations, things she loved, adaptations you made, milestones you noticed..." oninput="state.noteText=this.value">${state.noteText}</textarea>
          <button class="notes-save" style="background:#B05070;" onclick="saveNote()">Save Note</button>
        </div>
      </div>` : ""}

    </div><!-- /main-area -->

    <!-- FAB -->
    ${!state.overlay ? `<button class="fab" onclick="openOverlay('help')">💬</button>` : ""}

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-btn" onclick="setScreen('home')">
        <span class="nav-icon">📅</span>
        <span class="nav-label${state.screen==="home"?" active":""}">This Week</span>
      </button>
      <button class="nav-btn" onclick="setScreen('docs')">
        <span class="nav-icon">📄</span>
        <span class="nav-label${state.screen==="docs"?" active":""}">Documents</span>
      </button>
      <button class="nav-btn" onclick="openOverlay('notes')">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">Notes</span>
      </button>
    </nav>
  `;

  // Scroll chat to bottom
  const chatBody = document.getElementById("chat-body");
  if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;

  // Restore textarea
  const ta = document.getElementById("notes-ta");
  if (ta) ta.value = state.noteText;

  // Install banner logic
  setupBanner();
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function setScreen(s) { state.screen = s; state.overlay = null; render(); }
function setTab(t) { state.tab = t; render(); window.scrollTo(0,0); const el = document.getElementById("home-screen"); if(el) el.scrollTo(0,0); }
function openOverlay(o) { state.overlay = o; render(); }
function closeOverlay() { state.overlay = null; render(); }
function selectWeek(i) { state.weekIdx = i; state.overlay = null; state.tab = "activities"; state.screen = "home"; render(); }

function sendHelp() {
  const input = document.getElementById("chat-input");
  const msg = (input ? input.value : state.helpInput).trim();
  if (!msg) return;
  state.helpMsgs.push({from:"user", text:msg});
  state.helpInput = "";
  render();
  setTimeout(() => {
    const w = WEEKS[state.weekIdx];
    const fn = HELP_REPLIES[Math.floor(Math.random()*HELP_REPLIES.length)];
    state.helpMsgs.push({from:"guide", text:fn(w)});
    render();
  }, 700);
}

function saveNote() {
  const ta = document.getElementById("notes-ta");
  if (ta) state.noteText = ta.value;
  const key = `note_week_${state.weekIdx}`;
  try { localStorage.setItem(key, state.noteText); } catch(e) {}
  // Flash save confirmation
  const btn = document.querySelector(".notes-save");
  if (btn) { btn.textContent = "Saved ✓"; btn.style.background="#5A7A5A"; setTimeout(()=>{ btn.textContent="Save Note"; btn.style.background="#B05070"; },1500); }
}

// ─── Install banner ───────────────────────────────────────────────────────────
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById("install-btn");
  const txt = document.getElementById("banner-text");
  if (btn && txt) {
    txt.textContent = "📲 Install Naomi's curriculum app";
    btn.style.display = "block";
  }
});

function setupBanner() {
  const dismissBtn = document.getElementById("dismiss-btn");
  if (dismissBtn) dismissBtn.onclick = () => {
    localStorage.setItem("banner_dismissed","1");
    state.showBanner = false;
    render();
  };
  const installBtn = document.getElementById("install-btn");
  if (installBtn) installBtn.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const {outcome} = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === "accepted") { state.showBanner = false; render(); }
    }
  };
}

// ─── Service Worker ───────────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE="guw-v1";
    self.addEventListener("install",e=>{self.skipWaiting();});
    self.addEventListener("activate",e=>{self.clients.claim();});
    self.addEventListener("fetch",e=>{
      if(e.request.method!=="GET")return;
      e.respondWith(
        caches.open(CACHE).then(cache=>
          cache.match(e.request).then(hit=>{
            const net=fetch(e.request).then(res=>{
              if(res&&res.status===200)cache.put(e.request,res.clone());
              return res;
            });
            return hit||net;
          })
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type:"application/javascript"});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
